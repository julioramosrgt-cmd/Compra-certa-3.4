<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Certa 3.5</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <!-- Biblioteca Html5Qrcode para alta precisão -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #00875a;
            --text: #ffffff;
            --text-sub: #aaaaaa;
            --danger: #de350b;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary);
        }
        nav {
            display: flex;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            text-align: center;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        main {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid var(--border);
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            box-sizing: border-box;
        }
        .btn-danger { background-color: var(--danger); }
        #reader-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }
        .status-msg {
            font-size: 0.85rem;
            color: #57d9a3;
            font-weight: bold;
            margin-top: 8px;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <header>
        <h1>Compra Certa 3.5</h1>
    </header>

    <nav>
        <button class="tab-btn active" onclick="switchTab('tab-compra', event)">🛒 Compra</button>
        <button class="tab-btn" onclick="switchTab('tab-lista', event)">📋 Lista</button>
    </nav>

    <main>
        <section id="tab-compra" class="tab-content active">
            <div class="card">
                <h2>📷 Escanear Código de Barras</h2>
                <button class="btn" onclick="iniciarLeitor()">📷 Abrir Câmera de Leitura Alta Precisão</button>
                <button class="btn btn-danger" id="btn-parar" style="display:none;" onclick="pararLeitor()">⏹️ Parar Câmera</button>
                
                <div id="reader-container">
                    <div id="reader"></div>
                </div>
                <p id="barcode-status" class="status-msg"></p>
            </div>

            <div class="card">
                <h2>🛒 Registrar Item no Carrinho</h2>
                <input type="text" id="prod-nome" placeholder="Nome do Produto / Especificação">
                <div style="display:flex; gap:10px;">
                    <input type="number" id="prod-qtd" placeholder="Qtd" value="1" min="1">
                    <input type="number" id="prod-preco" placeholder="Preço (R$)" step="0.01">
                </div>
                <button class="btn" onclick="addProdutoCarrinho()">+ Adicionar ao Carrinho</button>
            </div>
        </section>

        <section id="tab-lista" class="tab-content">
            <div class="card">
                <h2>📋 Minha Lista de Compras</h2>
                <input type="text" id="item-lista-nome" placeholder="O que precisa comprar?">
                <button class="btn" onclick="adicionarItemLista()">+ Adicionar à Lista</button>
            </div>
        </section>
    </main>

    <script>
        let html5QrCode = null;
        let lastDetectedCode = "";
        let detectionCount = 0;

        function switchTab(tabId, evt) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(evt) evt.currentTarget.classList.add('active');
            if(tabId !== 'tab-compra') pararLeitor();
        }

        // CONSULTA DE PRODUTOS NAS BASES PÚBLICAS (OPEN FOOD FACTS + MERCADO BRASIL)
        async function buscarProdutoPorCodigo(codigo) {
            const statusEl = document.getElementById('barcode-status');
            statusEl.innerText = `🔍 Código EAN validado: ${codigo}. Buscando produto...`;

            try {
                // 1. Consulta à base Open Food Facts Brasil
                let res = await fetch(`https://br.openfoodfacts.org/api/v2/product/${codigo}.json`);
                let data = await res.json();

                if (data.status === 1 && data.product) {
                    const p = data.product;
                    const nome = p.product_name_pt || p.product_name || p.abbreviated_product_name || "";
                    const marca = p.brands ? ` - ${p.brands}` : "";
                    const qtd = p.quantity ? ` (${p.quantity})` : "";
                    
                    if (nome.trim() !== "") {
                        const descricao = `${nome}${marca}${qtd}`.trim();
                        document.getElementById('prod-nome').value = descricao;
                        statusEl.innerText = `✅ Produto Encontrado: ${descricao}`;
                        return;
                    }
                }

                // 2. Consulta de contingência para produtos nacionais
                res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${codigo}.json`);
                data = await res.json();

                if (data.status === 1 && data.product && data.product.product_name) {
                    const descricao = data.product.product_name;
                    document.getElementById('prod-nome').value = descricao;
                    statusEl.innerText = `✅ Produto Encontrado: ${descricao}`;
                    return;
                }

                // Não encontrado na base cadastrada
                document.getElementById('prod-nome').value = "";
                statusEl.innerText = `⚠️ Código ${codigo} lido com sucesso! Produto sem cadastro na base pública. Insira o nome manualmente.`;

            } catch (err) {
                console.error("Erro na busca:", err);
                document.getElementById('prod-nome').value = "";
                statusEl.innerText = `⚠️ Código ${codigo} lido com sucesso! Insira a especificação manualmente.`;
            }
        }

        // INICIAR CÂMERA DE LEITURA
        function iniciarLeitor() {
            document.getElementById('reader-container').style.display = 'block';
            document.getElementById('btn-parar').style.display = 'block';
            const statusEl = document.getElementById('barcode-status');
            statusEl.innerText = "Aponte a câmera para o código de barras...";

            lastDetectedCode = "";
            detectionCount = 0;

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = {
                fps: 15,
                qrbox: { width: 250, height: 150 },
                aspectRatio: 1.0,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A
                ]
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    // Validação de segurança: Exige 3 confirmações idênticas seguidas antes de aceitar
                    if (decodedText === lastDetectedCode) {
                        detectionCount++;
                    } else {
                        lastDetectedCode = decodedText;
                        detectionCount = 1;
                    }

                    if (detectionCount >= 3) {
                        pararLeitor();
                        buscarProdutoPorCodigo(decodedText);
                    } else {
                        statusEl.innerText = `⏳ Lendo código: ${decodedText} (focando...)`;
                    }
                },
                (errorMessage) => {
                    // Ignora erros de enquadramento enquanto procura
                }
            ).catch(err => {
                alert("Erro ao abrir a câmera: " + err);
                pararLeitor();
            });
        }

        function pararLeitor() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader-container').style.display = 'none';
                    document.getElementById('btn-parar').style.display = 'none';
                }).catch(err => console.error(err));
            } else {
                document.getElementById('reader-container').style.display = 'none';
                document.getElementById('btn-parar').style.display = 'none';
            }
        }
    </script>
</body>
</html>
