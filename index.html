<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Certa 3.4</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <!-- Biblioteca para leitura de código de barras via câmera -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #00875a;
            --primary-hover: #006644;
            --text: #ffffff;
            --text-sub: #aaaaaa;
            --danger: #de350b;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary);
        }
        nav {
            display: flex;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            text-align: center;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        main {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid var(--border);
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            box-sizing: border-box;
        }
        .btn-danger { background-color: var(--danger); }
        .btn-small { width: auto; padding: 5px 10px; font-size: 0.8rem; }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        #interactive.viewport {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
            margin-top: 10px;
        }
        #interactive.viewport video, #interactive.viewport canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <h1>Compra Certa 3.4</h1>
    </header>

    <nav>
        <button class="tab-btn active" onclick="switchTab('tab-compra', event)">🛒 Compra</button>
        <button class="tab-btn" onclick="switchTab('tab-lista', event)">📋 Lista</button>
        <button class="tab-btn" onclick="switchTab('tab-cupom', event)">🧾 Cupom</button>
    </nav>

    <main>
        <!-- TAB COMPRA -->
        <section id="tab-compra" class="tab-content active">
            <div class="card">
                <h2>📷 Escanear Código de Barras</h2>
                <button class="btn" onclick="iniciarLeitor()">📷 Abrir Câmera para Leitura</button>
                <div id="interactive" class="viewport" style="display:none;"></div>
                <p id="barcode-result" style="font-size:0.85rem; color:var(--primary); font-weight:bold;"></p>
            </div>

            <div class="card">
                <h2>🛒 Registrar Item no Carrinho</h2>
                <input type="text" id="prod-nome" placeholder="Nome do Produto ou Código">
                <div style="display:flex; gap:10px;">
                    <input type="number" id="prod-qtd" placeholder="Qtd" value="1" min="1">
                    <input type="number" id="prod-preco" placeholder="Preço (R$)" step="0.01">
                </div>
                <button class="btn" onclick="addProdutoCarrinho()">+ Adicionar ao Carrinho</button>
            </div>

            <div class="card">
                <h2>🛒 Itens no Carrinho</h2>
                <div id="carrinho-list">
                    <p style="color:#888; font-size:0.85rem;">Nenhum item adicionado ainda.</p>
                </div>
            </div>
        </section>

        <!-- TAB LISTA -->
        <section id="tab-lista" class="tab-content">
            <div class="card">
                <h2>📋 Minha Lista de Compras</h2>
                <input type="text" id="item-lista-nome" placeholder="O que precisa comprar?">
                <button class="btn" onclick="adicionarItemLista()">+ Adicionar à Lista</button>
            </div>
            <div class="card">
                <div id="lista-planejada-container">
                    <p style="color:#888; font-size:0.85rem;">Lista vazia.</p>
                </div>
            </div>
        </section>

        <!-- TAB CUPOM -->
        <section id="tab-cupom" class="tab-content">
            <div class="card">
                <h2>🧾 Captura de Cupom Fiscal</h2>
                <input type="file" id="cupom-img" accept="image/*" capture="environment" style="display:none;" onchange="alert('Imagem enviada com sucesso!')">
                <button class="btn" onclick="document.getElementById('cupom-img').click()">📷 Tirar Foto / Enviar Imagem</button>
            </div>
        </section>
    </main>

    <script>
        function switchTab(tabId, evt) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(evt) evt.currentTarget.classList.add('active');
            if(tabId !== 'tab-compra') pararLeitor();
        }

        let carrinho = [];
        function addProdutoCarrinho() {
            const nome = document.getElementById('prod-nome').value;
            const qtd = document.getElementById('prod-qtd').value;
            const preco = document.getElementById('prod-preco').value;
            if (!nome || !preco) { alert('Preencha nome e preço!'); return; }
            carrinho.push({ nome, qtd, preco });
            document.getElementById('prod-nome').value = '';
            document.getElementById('prod-preco').value = '';
            renderCarrinho();
        }

        function renderCarrinho() {
            const container = document.getElementById('carrinho-list');
            if (carrinho.length === 0) { container.innerHTML = '<p style="color:#888;">Vazio.</p>'; return; }
            container.innerHTML = carrinho.map(i => `
                <div class="item-row">
                    <div><strong>${i.nome}</strong> (${i.qtd}x)</div>
                    <div>R$ ${(i.qtd * i.preco).toFixed(2)}</div>
                </div>
            `).join('');
        }

        // LEITOR DE CÓDIGO DE BARRAS
        function iniciarLeitor() {
            const viewport = document.getElementById('interactive');
            viewport.style.display = 'block';

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: viewport,
                    constraints: { facingMode: "environment" }
                },
                decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] }
            }, function(err) {
                if (err) { alert("Erro ao acessar a câmera: " + err); return; }
                Quagga.start();
            });

            Quagga.onDetected(function(result) {
                const code = result.codeResult.code;
                document.getElementById('barcode-result').innerText = "Código Lido: " + code;
                document.getElementById('prod-nome').value = "Produto " + code;
                pararLeitor();
            });
        }

        function pararLeitor() {
            if (typeof Quagga !== 'undefined') {
                Quagga.stop();
                document.getElementById('interactive').style.display = 'none';
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registrado!'))
                .catch(err => console.log('Erro no SW:', err));
        }
    </script>
</body>
</html>
